<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Seaweed+Script&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <title>My Weather App</title>
</head>

<body>
    <div class="weather-app">
        <header>
            <form id="search-form">
                <input type="search" class="enter-city" placeholder="Enter a city..." required id="search-city" />
                <input type="submit" class="submit-button" value="Search" id="search-button" />
            </form>
            <br />
        </header>

        <main>
            <div class="current-weather">
                <div>
                    <h1 class="current-city">Dronten</h1>

                    <p class="current-details">
                        <span id="current-date"> Wednesday 10:35 </span>
                        <span>, partly cloudy </span>
                        <br />
                        <span>
                            Humidity: <strong> 61% </strong>, Wind:
                            <strong> 28km/h </strong>
                        </span>
                    </p>
                </div>
                <div class="temperature">
                    <span class="temperature-emoji">⛅</span>
                    <span class="current-temperature" id="temperature-value">24</span>
                    <span class="degrees">°C</span>
                </div>
            </div>
        </main>

        <footer>
            <p>
                This project was coded by
                <a href="#" target="_blank">Celeste Rust</a> and is
                <a href="https://github.com/cwildlife/my-first-weather-app" target="_blank"> on GitHub</a> and
                <a href="#" target="_blank">hosted on Netlify</a>
            </p>
        </footer>
    </div>

    <script src="src/index.js">
    </script>
</body>

</html>
